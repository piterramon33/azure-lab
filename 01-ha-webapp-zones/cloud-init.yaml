#cloud-config
# App mínima con la biblioteca estándar de Python: no instala paquetes,
# así que el arranque no depende de que haya salida a Internet.
write_files:
  - path: /opt/zoneapp/app.py
    permissions: "0644"
    content: |
      import json
      import socket
      import urllib.request
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      IMDS = "http://169.254.169.254/metadata/instance/compute/{}?api-version=2021-02-01&format=text"


      def imds(field):
          req = urllib.request.Request(IMDS.format(field), headers={"Metadata": "true"})
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          try:
              with opener.open(req, timeout=2) as resp:
                  return resp.read().decode() or "sin-zona"
          except Exception:
              return "desconocida"


      INFO = {"zone": imds("zone"), "region": imds("location"), "host": socket.gethostname()}

      PAGE = """<!doctype html>
      <html lang="es"><meta charset="utf-8"><title>Zona {zone}</title>
      <body style="font-family:system-ui;text-align:center;margin-top:15vh">
      <h1>Zona de disponibilidad {zone}</h1>
      <p>Instancia <b>{host}</b> en <b>{region}</b></p>
      <p>Recarga la página: el balanceador reparte entre las zonas.</p>
      </body></html>""".format(**INFO)


      class Handler(BaseHTTPRequestHandler):
          def _send(self, body, content_type):
              data = body.encode()
              self.send_response(200)
              self.send_header("Content-Type", content_type)
              self.send_header("Content-Length", str(len(data)))
              self.send_header("Cache-Control", "no-store")
              self.send_header("Connection", "close")
              self.end_headers()
              self.wfile.write(data)

          def do_GET(self):
              if self.path == "/health":
                  self._send("ok\n", "text/plain")
              elif self.path == "/api":
                  self._send(json.dumps(INFO) + "\n", "application/json")
              else:
                  self._send(PAGE, "text/html; charset=utf-8")

          def log_message(self, *args):
              pass


      ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()

  - path: /etc/systemd/system/zoneapp.service
    permissions: "0644"
    content: |
      [Unit]
      Description=App de demostracion de zonas
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/zoneapp/app.py
      DynamicUser=yes
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now zoneapp.service
