#cloud-config
# Plantilla de Terraform: db_ip y db_port se sustituyen al desplegar.
# La página comprueba en vivo qué deja pasar el NSG de la capa de datos.
write_files:
  - path: /opt/webtier/app.py
    permissions: "0644"
    content: |
      import json
      import socket
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      DB_HOST = "${db_ip}"
      DB_PORT = ${db_port}


      def probe(port):
          """Devuelve (abierto, texto recibido) al conectar con la capa de datos."""
          try:
              with socket.create_connection((DB_HOST, port), timeout=2) as conn:
                  conn.settimeout(2)
                  try:
                      return True, conn.recv(200).decode(errors="replace").strip()
                  except OSError:
                      return True, ""
          except OSError:
              return False, ""


      def checks():
          db_open, banner = probe(DB_PORT)
          ssh_open, _ = probe(22)
          return [
              {"prueba": "web -> datos, puerto %d" % DB_PORT, "esperado": "abierto",
               "resultado": "abierto" if db_open else "cerrado", "respuesta": banner},
              {"prueba": "web -> datos, puerto 22", "esperado": "cerrado",
               "resultado": "abierto" if ssh_open else "cerrado", "respuesta": ""},
          ]


      def page(results):
          rows = ""
          for r in results:
              ok = r["resultado"] == r["esperado"]
              rows += "<tr><td>{0}</td><td>{1}</td><td>{2}</td><td>{3}</td></tr>".format(
                  r["prueba"], r["esperado"], r["resultado"], "correcto" if ok else "FALLO")
          return (
              '<!doctype html><html lang="es"><meta charset="utf-8"><title>Red de 2 capas</title>'
              '<body style="font-family:system-ui;max-width:42rem;margin:10vh auto">'
              "<h1>Red de 2 capas</h1><p>Capa web: <b>" + socket.gethostname() + "</b>. "
              "Capa de datos: <b>" + DB_HOST + "</b>.</p>"
              '<table border="1" cellpadding="8" style="border-collapse:collapse">'
              "<tr><th>Prueba</th><th>Esperado</th><th>Resultado</th><th></th></tr>"
              + rows + "</table></body></html>")


      class Handler(BaseHTTPRequestHandler):
          def _send(self, body, content_type):
              data = body.encode()
              self.send_response(200)
              self.send_header("Content-Type", content_type)
              self.send_header("Content-Length", str(len(data)))
              self.send_header("Cache-Control", "no-store")
              self.send_header("Connection", "close")
              self.end_headers()
              self.wfile.write(data)

          def do_GET(self):
              if self.path == "/health":
                  self._send("ok\n", "text/plain")
              elif self.path == "/api":
                  self._send(json.dumps(checks(), ensure_ascii=False) + "\n", "application/json; charset=utf-8")
              else:
                  self._send(page(checks()), "text/html; charset=utf-8")

          def log_message(self, *args):
              pass


      ThreadingHTTPServer(("0.0.0.0", 80), Handler).serve_forever()

  - path: /etc/systemd/system/webtier.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Pagina de comprobacion de la capa web
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/webtier/app.py
      DynamicUser=yes
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now webtier.service
